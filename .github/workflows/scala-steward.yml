on:
  schedule:
  - cron: '0 17 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
concurrency: steward
jobs:
  scala-steward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'gitbucket' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - id: generate_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: 2717647
        private-key: ${{ secrets.GITBUCKET_BOT_KEY }}
        owner: ${{ github.repository_owner }}
    - uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee # v2.96.0
      with:
        github-token: ${{ steps.generate_token.outputs.token }}
        author-email: "256891351+gitbucket-bot[bot]@users.noreply.github.com"
        author-name: "gitbucket-bot[bot]"
        repos-file: "repos.md"
